[project]
name = "glm52-fresh-sqg-test"
version = "0.1.0"
description = "Zero-MCG fresh KQuant SQG treatment bridge for GLM 5.2"
requires-python = ">=3.12"
dependencies = ["torch>=2.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glm52_fresh_sqg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
