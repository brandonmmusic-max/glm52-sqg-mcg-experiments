[program:k96-runahead-guard]
command=/usr/local/sbin/k96-runahead-guard.sh
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/k96-logs/runahead-guard.log
stderr_logfile=/workspace/k96-logs/runahead-guard.err.log
stdout_logfile_maxbytes=10485760
stderr_logfile_maxbytes=10485760
stdout_logfile_backups=2
stderr_logfile_backups=2
